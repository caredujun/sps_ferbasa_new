<<!-- my_django_app/templates/admin/custo_variavel_adicionado_periodo.html -->

<!-- This block will be included to django admin basic template -->
{% extends "admin/base_site.html" %}

{% block content %}
<form action="" method="post">{% csrf_token %}
    <!--  The code of the form with all input fields will be automatically generated by Django  -->
    <p>Calcular / Atualizar o Custo Variável Adicionado Por Período:</p>
    {{ form }}
    <!--  Show the list of selected objects on the previous step  -->
    <p></p>
    <input type="submit" name="apply" value="Calcular" />
    <input type="submit" name="cancelar" value="Cancelar" />
    <p>Os sequintes Custos Variáveis Adicionados serão atualizados:</p>
    <ul>{{ items|unordered_list }}</ul>
    <!--  Link the action name in hidden params -->
    <input type="hidden" name="action" value="calcular_periodo" />
    <!--  Submit! Apply!  -->

</form>
{% endblock %}
