<!-- my_django_app/templates/admin/fluxos_producao_atualizar_input_output.html -->

<!-- This block will be included to django admin basic template -->
{% extends "admin/base_site.html" %}

{% block content %}
<form action="" method="post">{% csrf_token %}
    <!--  The code of the form with all input fields will be automatically generated by Django  -->
    <p>Atualizar Fluxos de Produção (Input/Output):</p>
    {{ form }}
    <!--  Show the list of selected objects on the previous step  -->
    <p></p>

    <p>Os Input/Output dos sequintes Fluxos de Produção serão atualizados:</p>
    <ul>{{ items|unordered_list }}</ul>
    <!--  Link the action name in hidden params -->
    <input type="submit" name="apply" value="Atualizar" />
    <input type="submit" name="cancelar" value="Cancelar" />
    <input type="hidden" name="action" value="atualiza_input_output_fluxos" />
    <!-- Tem que ser igual ao nome do def no admin -->
    <!--  Submit! Apply!  -->

</form>
{% endblock %}
